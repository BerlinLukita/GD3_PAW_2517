<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Form Pendaftaran</h1>


    <p>
        <a href="profil.html" onclick="return konfirmasiPindah()">Profil</a> |
        <a href="interaktif.html" onclick="return konfirmasiPindah()">Interaktif</a>
    </p>

    <form action="proses.php" method="post">

        <p>
            <label for="nama">Nama:</label><br>
            <input type="text" id="nama" name="nama" required>
        </p>

        <p>
            <label>Jenis Kelamin:</label><br>
            <input type="radio" name="jk" value="L" required> Laki-laki
            <input type="radio" name="jk" value="P"> Perempuan
        </p>

        <p>
            <label for="prodi">Program Studi:</label><br>
            <select id="prodi" name="prodi" required>
                <option value="">-- Pilih Prodi --</option>
                <option value="informatika">Informatika</option>
                <option value="sistem_informasi">Sistem Informasi</option>
                <option value="teknik_industri>Teknik Industri</option>
            </select>
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="alasan">Alasan:</label><br>
            <textarea id="alasan" name="alasan" required></textarea>
        </p>

        <p>
            <input type="submit" value="Kirim">
        </p>

    </form>

    <script>
    function konfirmasiPindah() {
        return confirm("Yakin ingin pindah halaman?");
    }
    </script>

</body>
</html>
