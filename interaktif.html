<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Interaktif</title>
</head>
<body>

    <h1 id="judulHalaman">Halaman Interaktif Saya</h1>

    <p>
        <a href="profil.html" onclick="return konfirmasiPindah()">Profil</a> |
        <a href="form.html" onclick="return konfirmasiPindah()">Form</a>
    </p>

    <p id="teks">Teks ini bisa berubah</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>

    <hr>

    <h2>Input Nama</h2>
    <input type="text" id="inputNama">
    <button onclick="tampilkanNama()">Tampilkan</button>

    <hr>

    <h2>Hitung Kuadrat</h2>
    <input type="number" id="angka">
    <button onclick="hitungKuadrat()">Hitung</button>

    <p id="hasil"></p>

    <script>
        const judul = document.getElementById("judulHalaman");
        judul.style.color = "red";

        function ubahBiru() {
            document.getElementById("teks").style.color = "blue";
        }

        function tampilkanNama() {
            const nama = document.getElementById("inputNama").value;

            if (nama === "") {
                alert("Silakan isi nama dulu.");
            } else {
                alert("Halo, " + nama + "!");
            }
        }

        function hitungKuadrat() {
            const angka = document.getElementById("angka").value;

            if (angka === "") {
                alert("Masukkan angka dulu!");
            } else {
                document.getElementById("hasil").innerHTML =
                    "Hasil: " + (angka * angka);
            }
        }

        function konfirmasiPindah() {
            return confirm("Yakin ingin pindah halaman?");
        }
    </script>

</body>
</html>
